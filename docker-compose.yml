services:
  # The service that spins up all services at once in one container (AIO)
  hoppscotch-aio:
    profiles: ["default"]
    container_name: hoppscotch
    restart: unless-stopped
    image: hoppscotch/hoppscotch:latest
    env_file:
      - ./.env
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    networks:
      - default
      - aps_network

  # Profile with no database dependency (purely developmental)
  hoppscotch-aio-no-db:
    profiles: ["default-no-db"]
    container_name: hoppscotch
    restart: unless-stopped
    image: hoppscotch/hoppscotch:latest
    env_file:
      - ./.env
    networks:
      - default
      - aps_network

  # The preset DB service
  hoppscotch-db:
    profiles:
      [
        "default",
        "database",
        "just-backend",
        "backend",
        "app",
        "admin",
        "deprecated",
      ]
    image: postgres:15
    container_name: hoppscotch-db
    restart: always
    volumes:
      - hoppscotch-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: hoppscotch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  # Auto-migration service - handles database migrations automatically
  hoppscotch-migrate:
    profiles: ["default", "just-backend", "backend", "app", "admin"]
    image: hoppscotch/hoppscotch:latest
    env_file:
      - ./.env
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npx prisma migrate deploy"]
    working_dir: /dist/backend
    networks:
      - default

  # PostgreSQL Web UI (pgAdmin) - Opsional
  pgadmin:
    profiles: ["database"]
    image: dpage/pgadmin4:latest
    container_name: hoppscotch-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hoppscotch.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    networks:
      - default

  # Backend service only (jika tidak pakai AIO)
  hoppscotch-backend:
    profiles: ["backend", "just-backend", "app", "admin"]
    container_name: hoppscotch-backend
    build:
      dockerfile: prod.Dockerfile
      context: .
      target: backend
      network: host
    env_file:
      - ./.env
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:testpass@hoppscotch-db:5432/hoppscotch?connect_timeout=300
      - PORT=8080
    volumes:
      - /usr/src/app/node_modules/
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    networks:
      - default

  # Main app only (jika tidak pakai AIO)
  hoppscotch-app:
    profiles: ["app"]
    container_name: hoppscotch-app
    build:
      dockerfile: prod.Dockerfile
      context: .
      target: app
      network: host
    env_file:
      - ./.env
    depends_on:
      - hoppscotch-backend
    networks:
      - default

  # Admin dashboard only (jika tidak pakai AIO)
  hoppscotch-sh-admin:
    profiles: ["admin"]
    container_name: hoppscotch-sh-admin
    build:
      dockerfile: prod.Dockerfile
      context: .
      target: sh_admin
      network: host
    env_file:
      - ./.env
    depends_on:
      - hoppscotch-backend
    networks:
      - default

volumes:
  hoppscotch-db-data:

networks:
  default:
  aps_network:
    external: true